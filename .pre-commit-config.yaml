---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.2.0
    hooks:
      # Non modifying hooks
      - id: check-added-large-files
      - id: check-yaml
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-toml
      - id: check-vcs-permalinks
      #- id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
        # Modifying hooks
      - id: requirements-txt-fixer
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.9.0
    hooks:
      - id: python-no-eval
      - id: python-no-log-warn
  # Security Issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.4
    hooks:
    - id: bandit
      args: ["-c", "pyproject.toml"]
      additional_dependencies: ["bandit[toml]", "pbr"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.7.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  # isort for python import sorting
  # - repo: https://github.com/pycqa/isort
  #  rev: 5.13.2
  #  hooks:
  #    - id: isort
  #      args: [ "--profile", "black" ]

  # Update the version of python as necessary per project
  # Try to use the latest python if possible
  #- repo: https://github.com/asottile/pyupgrade
  #  rev: v2.37.3
  #  hooks:
  #    - id: pyupgrade
  #      args: [--py310-plus]

  # Keep last to ensure formatting happens after all other fixes
  #- repo: https://github.com/psf/black
  #  rev: 23.1.0
  #  hooks:
  #    - id: black
  #      args: ["--line-length", "120"]
  #    - id: black-jupyter
#
  # Remove python notebook outputs before commit
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout

  -   repo: local
      hooks:
      -   id: mypy
          name: mypy
          entry: uv run mypy
          language: system
          types: [python]
          files: ^(src|tests)/.*\.py$
          exclude: ^src/db/migrations/.*$

  # Commitizen commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]

