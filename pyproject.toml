[project]
name = "llm-scraper"
version = "2.0.0"
description = "Intelligent web scraping with XPath and LLM fallback - Enhanced with ParserGPT patterns"
authors = [
    {name = "Diego", email = "diego@pickle.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "anthropic>=0.8.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
    "knockapi>=0.5.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "boto3-stubs[s3]>=1.34.0",
    "types-python-dateutil>=2.8.19",
    "ipython>=8.18.0",
]

[project.scripts]
scraper = "scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers", "--cov=scraper"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
